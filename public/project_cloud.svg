<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="cyberSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#cloudBg)"/>
  <rect width="100%" height="100%" fill="none" stroke="#1f1f1f" stroke-width="1.5"/>
  
  <!-- Grid -->
  <path d="M 0,50 L 600,50 M 0,100 L 600,100 M 0,150 L 600,150 M 0,200 L 600,200 M 0,250 L 600,250 M 0,300 L 600,300 M 0,350 L 600,350" stroke="#141416" stroke-width="0.5"/>
  <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400" stroke="#141416" stroke-width="0.5"/>

  <!-- Header -->
  <rect width="600" height="40" fill="#0c0c0e"/>
  <circle cx="25" cy="20" r="4" fill="#27272a"/>
  <circle cx="40" cy="20" r="4" fill="#27272a"/>
  <circle cx="55" cy="20" r="4" fill="#27272a"/>
  <text x="300" y="25" font-family="monospace" font-size="11" fill="#a1a1aa" text-anchor="middle" font-weight="bold">KUBEFLOW_ORCHESTRATOR // AWS_EKS</text>

  <!-- Node pipeline visualization (DAG) -->
  <g transform="translate(60, 90)">
    <!-- Nodes -->
    <!-- Node 1: Ingest -->
    <rect x="0" y="70" width="100" height="50" rx="4" fill="#09090b" stroke="#52525b" stroke-width="1.5"/>
    <text x="50" y="99" font-family="monospace" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">S3_INGEST</text>
    <circle cx="100" cy="95" r="3.5" fill="#ffffff"/>

    <!-- Link Node 1 -> Node 2 -->
    <path d="M 100,95 L 170,45" fill="none" stroke="#27272a" stroke-width="1.5"/>
    <!-- Link Node 1 -> Node 3 -->
    <path d="M 100,95 L 170,145" fill="none" stroke="#27272a" stroke-width="1.5"/>

    <!-- Node 2: Spark Processing Task A -->
    <rect x="170" y="20" width="120" height="50" rx="4" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="230" y="49" font-family="monospace" font-size="9" fill="#a1a1aa" text-anchor="middle" font-weight="bold">SPARK_JOIN_A</text>
    <circle cx="290" cy="45" r="3.5" fill="#a1a1aa"/>

    <!-- Node 3: Spark Processing Task B -->
    <rect x="170" y="120" width="120" height="50" rx="4" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="230" y="149" font-family="monospace" font-size="9" fill="#a1a1aa" text-anchor="middle" font-weight="bold">SPARK_CLEAN_B</text>
    <circle cx="290" cy="145" r="3.5" fill="#a1a1aa"/>

    <!-- Link Node 2 -> Node 4 -->
    <path d="M 290,45 L 360,95" fill="none" stroke="#27272a" stroke-width="1.5"/>
    <!-- Link Node 3 -> Node 4 -->
    <path d="M 290,145 L 360,95" fill="none" stroke="#27272a" stroke-width="1.5"/>

    <!-- Node 4: Aggregate -->
    <rect x="360" y="70" width="110" height="50" rx="4" fill="#09090b" stroke="#52525b" stroke-width="1.5"/>
    <text x="415" y="99" font-family="monospace" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">AGGREGATION</text>
  </g>

  <!-- Live Statistics / Metrics Chart Overlay -->
  <g transform="translate(60, 280)">
    <rect width="480" height="90" rx="6" fill="#0c0c0e" stroke="#1f1f1f" stroke-width="1"/>
    
    <!-- CPU Spark nodes line chart -->
    <path d="M 30,70 L 100,50 L 170,65 L 240,30 L 310,40 L 380,20 L 450,45" fill="none" stroke="url(#cyberSilver)" stroke-width="1.5"/>
    
    <text x="30" y="25" font-family="sans-serif" font-size="10" fill="#71717a" font-weight="bold">Spark Driver CPU Utilization: 87.4%</text>
    <text x="390" y="25" font-family="monospace" font-size="9" fill="#ffffff">Live Uptime: 99.98%</text>
  </g>
</svg>
