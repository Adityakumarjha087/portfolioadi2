<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="microBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#microBg)"/>
  <rect width="100%" height="100%" fill="none" stroke="#1f1f1f" stroke-width="1.5"/>
  
  <!-- Grid -->
  <path d="M 0,50 L 600,50 M 0,100 L 600,100 M 0,150 L 600,150 M 0,200 L 600,200 M 0,250 L 600,250 M 0,300 L 600,300 M 0,350 L 600,350" stroke="#141416" stroke-width="0.5"/>
  <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400" stroke="#141416" stroke-width="0.5"/>

  <!-- Header -->
  <rect width="600" height="40" fill="#0c0c0e"/>
  <circle cx="25" cy="20" r="4" fill="#27272a"/>
  <circle cx="40" cy="20" r="4" fill="#27272a"/>
  <circle cx="55" cy="20" r="4" fill="#27272a"/>
  <text x="300" y="25" font-family="monospace" font-size="11" fill="#a1a1aa" text-anchor="middle" font-weight="bold">VELOCE_MICROSERVICES // HIGH_THROUGHPUT</text>

  <!-- Microservices Block Diagram -->
  <g transform="translate(40, 70)">
    <!-- API Gateway -->
    <rect x="0" y="55" width="80" height="90" rx="3" fill="#09090b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="40" y="95" font-family="monospace" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">API_GW</text>
    
    <!-- Connect API gateway to other services -->
    <path d="M 80,100 L 150,60 M 80,100 L 150,140" fill="none" stroke="#27272a" stroke-width="1.5"/>

    <!-- Service A: Order Microservice -->
    <rect x="150" y="20" width="120" height="60" rx="3" fill="#09090b" stroke="#52525b" stroke-width="1.5"/>
    <text x="210" y="50" font-family="monospace" font-size="9" fill="#a1a1aa" text-anchor="middle" font-weight="bold">ORDER_SERVICE</text>
    <circle cx="270" cy="50" r="3" fill="#a1a1aa"/>

    <!-- Service B: Payment Microservice -->
    <rect x="150" y="120" width="120" height="60" rx="3" fill="#09090b" stroke="#52525b" stroke-width="1.5"/>
    <text x="210" y="150" font-family="monospace" font-size="9" fill="#a1a1aa" text-anchor="middle" font-weight="bold">PAY_SERVICE</text>
    <circle cx="270" cy="150" r="3" fill="#a1a1aa"/>

    <!-- Kafka Event Stream (Middle Channel) -->
    <g transform="translate(310, 20)">
      <rect width="60" height="160" rx="3" fill="#09090b" stroke="#ffffff" stroke-width="1.5"/>
      <text x="30" y="20" font-family="monospace" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">KAFKA</text>
      <!-- Pipes inside Kafka -->
      <circle cx="30" cy="50" r="3" fill="#ffffff"/>
      <circle cx="30" cy="90" r="3" fill="#ffffff"/>
      <circle cx="30" cy="130" r="3" fill="#ffffff"/>
      <path d="M 30,50 L 30,130" fill="none" stroke="#27272a" stroke-width="1"/>
    </g>

    <!-- Connect services to Kafka -->
    <path d="M 270,50 L 310,60" fill="none" stroke="#27272a" stroke-width="1.5"/>
    <path d="M 270,150 L 310,140" fill="none" stroke="#27272a" stroke-width="1.5"/>

    <!-- Database / Sink -->
    <rect x="410" y="55" width="90" height="90" rx="3" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="455" y="105" font-family="monospace" font-size="8" fill="#a1a1aa" text-anchor="middle" font-weight="bold">POSTGRES</text>
    
    <!-- Connect Kafka to Database -->
    <path d="M 370,100 L 410,100" fill="none" stroke="#27272a" stroke-width="1.5"/>
  </g>

  <!-- Bottom Panel: Rates & Latencies -->
  <g transform="translate(40, 290)">
    <rect width="520" height="80" rx="6" fill="#0c0c0e" stroke="#1f1f1f" stroke-width="1"/>
    
    <text x="25" y="30" font-family="monospace" font-size="11" fill="#ffffff">&gt; Concurrency: 12,000 req/sec</text>
    <text x="25" y="55" font-family="monospace" font-size="11" fill="#a1a1aa">&gt; p99 latency: 14.8 ms</text>
    
    <!-- Redis caching percentage indicators -->
    <text x="450" y="45" font-family="sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">92%</text>
    <text x="450" y="60" font-family="sans-serif" font-size="9" fill="#71717a" text-anchor="middle">Cache Hit Ratio</text>
  </g>
</svg>
