<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    
    <!-- Cyber Monochrome Gradients -->
    <linearGradient id="cyberSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
    <linearGradient id="cyberGrey" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Outer Tech Circle -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#cyberGrey)" stroke-width="1" stroke-dasharray="8 12" opacity="0.4"/>
  <circle cx="250" cy="250" r="200" fill="none" stroke="#27272a" stroke-width="0.75" opacity="0.3"/>
  
  <!-- Glow Effect -->
  <circle cx="250" cy="250" r="180" fill="url(#glow)"/>

  <!-- Tech Grid Background -->
  <path d="M 150,250 L 350,250 M 250,150 L 250,350 M 180,180 L 320,320 M 180,320 L 320,180" stroke="#52525b" stroke-width="0.5" opacity="0.15"/>

  <!-- Rotating tech bits -->
  <path d="M 250,60 A 190,190 0 0,1 440,250" fill="none" stroke="url(#cyberSilver)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 250,440 A 190,190 0 0,1 60,250" fill="none" stroke="url(#cyberGrey)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Futuristic Geometric Avatar / Cybernetic Node Face -->
  <g transform="translate(135, 125)">
    <!-- Base polygonal head -->
    <polygon points="115,30 190,75 190,165 115,210 40,165 40,75" fill="#09090b" stroke="url(#cyberSilver)" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Face Division Lines -->
    <line x1="115" y1="30" x2="115" y2="210" stroke="url(#cyberGrey)" stroke-width="1" opacity="0.4"/>
    <line x1="40" y1="75" x2="190" y2="165" stroke="url(#cyberGrey)" stroke-width="0.5" opacity="0.2"/>
    <line x1="190" y1="75" x2="40" y2="165" stroke="url(#cyberGrey)" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Glowing Eye Nodes -->
    <!-- Left Eye Node -->
    <circle cx="85" cy="100" r="5" fill="#ffffff"/>
    <circle cx="85" cy="100" r="10" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    
    <!-- Right Eye Node -->
    <circle cx="145" cy="100" r="5" fill="#a1a1aa"/>
    <circle cx="145" cy="100" r="10" fill="none" stroke="#a1a1aa" stroke-width="1" opacity="0.5"/>

    <!-- Connections to eyes -->
    <polyline points="115,60 85,100 115,120 145,100 115,60" fill="none" stroke="url(#cyberGrey)" stroke-width="1" opacity="0.4"/>

    <!-- Neural lines coming out of head -->
    <path d="M 115,30 L 115,0 L 140,-15" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <circle cx="140" cy="-15" r="2.5" fill="#ffffff"/>

    <path d="M 190,75 L 220,60 L 240,70" fill="none" stroke="#a1a1aa" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <circle cx="240" cy="70" r="2.5" fill="#a1a1aa"/>

    <path d="M 40,75 L 10,60 L -10,70" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <circle cx="-10" cy="70" r="2.5" fill="#ffffff"/>

    <!-- Digital mouth grid -->
    <path d="M 95,155 L 135,155 M 100,162 L 130,162 M 108,169 L 122,169" stroke="url(#cyberSilver)" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- Interactive Tech Labels inside SVG -->
  <text x="250" y="415" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#ffffff" letter-spacing="3" text-anchor="middle" font-weight="500" opacity="0.8">SYS.INIT.OK</text>
  <text x="250" y="432" font-family="monospace" font-size="8" fill="#a1a1aa" letter-spacing="1" text-anchor="middle" opacity="0.5">PORT 8080 // ADITYA_JHA // RX_ACTIVE</text>
</svg>
