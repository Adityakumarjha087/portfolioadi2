<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="streamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="silverWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#streamBg)"/>
  <rect width="100%" height="100%" fill="none" stroke="#1f1f1f" stroke-width="1.5"/>
  
  <!-- Grid -->
  <path d="M 0,50 L 600,50 M 0,100 L 600,100 M 0,150 L 600,150 M 0,200 L 600,200 M 0,250 L 600,250 M 0,300 L 600,300 M 0,350 L 600,350" stroke="#141416" stroke-width="0.5"/>
  <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400" stroke="#141416" stroke-width="0.5"/>

  <!-- Header -->
  <rect width="600" height="40" fill="#0c0c0e"/>
  <circle cx="25" cy="20" r="4" fill="#27272a"/>
  <circle cx="40" cy="20" r="4" fill="#27272a"/>
  <circle cx="55" cy="20" r="4" fill="#27272a"/>
  <text x="300" y="25" font-family="monospace" font-size="11" fill="#a1a1aa" text-anchor="middle" font-weight="bold">WEBRTC_P2P_MESH_STREAM // PROTOCOL</text>

  <!-- Mesh Net Nodes Diagram -->
  <g transform="translate(180, 70)">
    <!-- Central Stream Seed Node -->
    <circle cx="120" cy="100" r="24" fill="#09090b" stroke="#ffffff" stroke-width="2"/>
    <text x="120" y="104" font-family="monospace" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">SEED</text>

    <!-- Peers -->
    <!-- Peer 1 -->
    <circle cx="40" cy="40" r="16" fill="#000000" stroke="#52525b" stroke-width="1.5"/>
    <text x="40" y="43" font-family="sans-serif" font-size="9" fill="#a1a1aa" text-anchor="middle">P1</text>
    <!-- Peer 2 -->
    <circle cx="200" cy="40" r="16" fill="#000000" stroke="#52525b" stroke-width="1.5"/>
    <text x="200" y="43" font-family="sans-serif" font-size="9" fill="#a1a1aa" text-anchor="middle">P2</text>
    <!-- Peer 3 -->
    <circle cx="40" cy="160" r="16" fill="#000000" stroke="#52525b" stroke-width="1.5"/>
    <text x="40" y="163" font-family="sans-serif" font-size="9" fill="#a1a1aa" text-anchor="middle">P3</text>
    <!-- Peer 4 -->
    <circle cx="200" cy="160" r="16" fill="#000000" stroke="#52525b" stroke-width="1.5"/>
    <text x="200" y="163" font-family="sans-serif" font-size="9" fill="#a1a1aa" text-anchor="middle">P4</text>

    <!-- Connections (Peer to Peer Mesh) -->
    <!-- Seed to Peers -->
    <line x1="120" y1="100" x2="40" y2="40" stroke="#27272a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="120" y1="100" x2="200" y2="40" stroke="#27272a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="120" y1="100" x2="40" y2="160" stroke="#27272a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="120" y1="100" x2="200" y2="160" stroke="#27272a" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Inter-peer connections (WebRTC Data channels sharing chunks) -->
    <line x1="40" y1="40" x2="200" y2="40" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="40" y1="40" x2="40" y2="160" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="200" y1="40" x2="200" y2="160" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="40" y1="160" x2="200" y2="160" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Bottom Panel: Mesh savings info -->
  <g transform="translate(60, 290)">
    <rect width="480" height="80" rx="6" fill="#0c0c0e" stroke="#1f1f1f" stroke-width="1"/>
    
    <text x="25" y="30" font-family="monospace" font-size="11" fill="#ffffff">&gt; Active Peer Mesh Size: 418 nodes</text>
    <text x="25" y="55" font-family="monospace" font-size="11" fill="#a1a1aa">&gt; CDN Bandwidth Saved: 73.8%</text>

    <!-- Signal pulsing -->
    <circle cx="440" cy="45" r="4" fill="#ffffff"/>
  </g>
</svg>
